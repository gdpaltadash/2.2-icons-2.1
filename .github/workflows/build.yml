name: Build (Geode v1.3.10 / GD 2.113)

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

env:
  GEODE_TAG: v1.3.10
  MOD_ID: local.icons22_2113

jobs:
  build:
    name: Windows (Win32)
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      # Geode SDK pinned to v1.3.10 (the modern geode-sdk/build-geode-mod action only
      # builds 64-bit Windows, GD 2.113 is 32-bit, so we configure CMake ourselves)
      - name: Checkout Geode SDK
        uses: actions/checkout@v4
        with:
          repository: geode-sdk/geode
          ref: ${{ env.GEODE_TAG }}
          path: geode-sdk

      - name: Download Geode v1.3.10 binaries (Geode.lib)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force geode-sdk/bin/1.3.10 | Out-Null
          Invoke-WebRequest "https://github.com/geode-sdk/geode/releases/download/$env:GEODE_TAG/geode-v1.3.10-win.zip" -OutFile geode-win.zip
          Expand-Archive geode-win.zip -DestinationPath geode-sdk/bin/1.3.10 -Force
          Get-ChildItem geode-sdk/bin/1.3.10

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1.12.1
        with:
          arch: x86

      - name: Configure
        shell: pwsh
        env:
          GEODE_SDK: ${{ github.workspace }}/geode-sdk
        run: >
          cmake -B build
          -T host=x64 -A win32
          -DCMAKE_BUILD_TYPE=Release
          -DGEODE_DISABLE_CLI_CALLS=On
          -DCMAKE_POLICY_VERSION_MINIMUM=3.5

      - name: Build
        shell: pwsh
        env:
          GEODE_SDK: ${{ github.workspace }}/geode-sdk
        run: cmake --build build --config Release --parallel

      # No Geode CLI needed: a .geode file is a zip with mod.json + <id>.dll
      - name: Package .geode
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Recurse build -Filter "Icons22GD2113.dll" | Select-Object -First 1
          if (-not $dll) { throw "Icons22GD2113.dll not found" }
          New-Item -ItemType Directory -Force pkg | Out-Null
          Copy-Item $dll.FullName "pkg/$env:MOD_ID.dll"
          Copy-Item mod.json, about.md pkg/
          Compress-Archive -Path pkg/* -DestinationPath "$env:MOD_ID.zip" -Force
          Move-Item "$env:MOD_ID.zip" "$env:MOD_ID.geode" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.MOD_ID }}
          path: ${{ env.MOD_ID }}.geode
